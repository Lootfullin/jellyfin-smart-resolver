name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  JELLYFIN_VERSION: 10.11.11

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Build, test and package
        shell: bash
        run: ./scripts/package.sh "${GITHUB_REF_NAME#v}" "$JELLYFIN_VERSION"
      - name: Create plugin catalog manifest
        shell: pwsh
        run: |
          $pluginVersion = $env:GITHUB_REF_NAME.Substring(1)
          $archive = "artifacts/Jellyfin.SmartResolver_${pluginVersion}_jellyfin-$env:JELLYFIN_VERSION.zip"
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm MD5).Hash
          ./scripts/create-manifest.ps1 `
            -Repository '${{ github.repository }}' `
            -Checksum $checksum `
            -ReleaseTag '${{ github.ref_name }}' `
            -PluginVersion $pluginVersion `
            -JellyfinVersion $env:JELLYFIN_VERSION
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/Jellyfin.SmartResolver_*.zip
            artifacts/Jellyfin.SmartResolver_*.zip.sha256
      - name: Publish catalog manifest
        shell: bash
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.json"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/manifest.json" manifest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          git diff --cached --quiet || git commit -m "Update plugin manifest for ${GITHUB_REF_NAME}"
          git push origin main
