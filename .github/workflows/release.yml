name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  JELLYFIN_VERSION: 10.11.11

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Build, test and package
        shell: bash
        run: ./scripts/package.sh "${GITHUB_REF_NAME#v}" "$JELLYFIN_VERSION"
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/Jellyfin.SmartResolver_*.zip
            artifacts/Jellyfin.SmartResolver_*.zip.sha256
      - name: Publish catalog manifest
        shell: pwsh
        run: |
          $pluginVersion = $env:GITHUB_REF_NAME.Substring(1)
          $archive = "artifacts/Jellyfin.SmartResolver_${pluginVersion}_jellyfin-$env:JELLYFIN_VERSION.zip"
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm MD5).Hash
          git fetch origin main
          git checkout -B main origin/main
          ./scripts/create-manifest.ps1 `
            -Repository '${{ github.repository }}' `
            -Checksum $checksum `
            -ReleaseTag '${{ github.ref_name }}' `
            -PluginVersion $pluginVersion `
            -JellyfinVersion $env:JELLYFIN_VERSION
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update plugin manifest for $env:GITHUB_REF_NAME"
          }
          git push origin main
